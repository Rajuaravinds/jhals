<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>for Jhals</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root { --text: #f4ecff; --muted: #8f84ad; --pink: #ff8fc4; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #000; color: var(--text); font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; overflow: hidden; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; }
  .gate { position: fixed; inset: 0; display: grid; place-items: center; padding: 16px; transition: opacity 1s, transform 1s; }
  .gate.leave { opacity: 0; transform: scale(1.04); }
  .card { text-align: center; max-width: 360px; width: 100%; }
  .heart { display: grid; grid-template-columns: repeat(7, 9px); gap: 2px; justify-content: center; margin: 0 auto 26px; animation: beat 1.6s ease-in-out infinite; }
  .heart i { width: 9px; height: 9px; background: var(--pink); box-shadow: 0 0 10px rgba(255,120,190,.6); }
  .heart i.o { background: transparent; box-shadow: none; }
  @keyframes beat { 0%, 100% { transform: scale(1); } 12% { transform: scale(1.12); } 24% { transform: scale(1); } 36% { transform: scale(1.08); } }
  h1 { font-weight: 300; font-size: clamp(12.5px, 3.9vw, 19px); letter-spacing: .01em; white-space: nowrap; }
  .card { max-width: none; }
  p { font-size: 12px; color: var(--muted); margin-top: 10px; letter-spacing: .04em; line-height: 1.6; }
  form { margin-top: 26px; display: flex; flex-direction: column; align-items: center; gap: 16px; }
  .dob { display: flex; gap: 8px; align-items: center; }
  .dob input { width: 54px; padding: 12px 0; text-align: center; font: 300 20px 'JetBrains Mono', monospace; color: var(--text);
               background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.14); border-radius: 12px; outline: none; }
  .dob input.y { width: 78px; }
  .dob input:focus { border-color: var(--pink); box-shadow: 0 0 0 3px rgba(255,143,196,.15); }
  .dob span { color: var(--muted); }
  label.rem { font-size: 11px; color: var(--muted); display: flex; gap: 6px; align-items: center; cursor: pointer; }
  button { padding: 11px 28px; border-radius: 999px; border: 0; background: linear-gradient(135deg, #ff7eb6, #c46bff); color: #fff;
           font: 400 14px 'JetBrains Mono', monospace; letter-spacing: .06em; cursor: pointer; }
  button:disabled { opacity: .6; }
  .msg { min-height: 1.4em; font-size: 12px; color: var(--pink); }
  .shake { animation: shake .45s; }
  /* music toggle, stays above the site after unlocking */
  .mbtn { position: fixed; z-index: 5; left: 12px; bottom: max(10px, env(safe-area-inset-bottom)); width: 34px; height: 34px; border-radius: 50%;
          border: 1px solid rgba(255,255,255,.14); background: rgba(30,28,36,.7); color: var(--text); cursor: pointer; display: grid; place-items: center;
          font-size: 15px; padding: 0; -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); }
  .mbtn .bars { display: none; gap: 2px; align-items: flex-end; height: 12px; }
  .mbtn .bars i { width: 2.5px; background: #ff9ccf; border-radius: 1px; animation: eq 1s ease-in-out infinite; }
  .mbtn .bars i:nth-child(2) { animation-delay: .25s; } .mbtn .bars i:nth-child(3) { animation-delay: .5s; }
  .mbtn.on .n { display: none; } .mbtn.on .bars { display: flex; }
  @keyframes eq { 0%, 100% { height: 3px; } 50% { height: 12px; } }
    .app { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; z-index: 1; opacity: 0; transition: opacity 1.2s; background: #000; }
  .app.on { opacity: 1; }
  @keyframes shake { 20%, 60% { transform: translateX(-7px); } 40%, 80% { transform: translateX(7px); } }
</style>
</head>
<body>
<canvas id="sky"></canvas>
<div class="gate" id="gate">
  <div class="card">
    <div class="heart" aria-hidden="true" id="heart"></div>
    <h1>this little universe is only for Jhals</h1>
    <p>enter your birthday to open it ♡</p>
    <form id="f" autocomplete="off">
      <div class="dob" id="dob">
        <input id="dd" inputmode="numeric" placeholder="DD" aria-label="day">
        <span>/</span>
        <input id="mm" inputmode="numeric" placeholder="MM" aria-label="month">
        <span>/</span>
        <input id="yy" class="y" inputmode="numeric" placeholder="YYYY" aria-label="year">
      </div>
      <label class="rem"><input type="checkbox" id="rem" checked> remember me on this device</label>
      <button id="go">open ♡</button>
      <div class="msg" id="msg"></div>
    </form>
  </div>
</div>

  stars = Array.from({ length: Math.floor(cv.width * cv.height / 3000) }, () => ({ x: Math.random() * cv.width, y: Math.random() * cv.height, s: (Math.random() ** 4 * 1.4 + .3) * d, p: Math.random() * 6.3, v: .4 + Math.random() * 1.5 }));
}
function draw(t) {
  cx.fillStyle = '#000'; cx.fillRect(0, 0, cv.width, cv.height); cx.fillStyle = '#fff';
  for (const s of stars) { cx.globalAlpha = .25 + .6 * (.5 + .5 * Math.sin(t / 1000 * s.v + s.p)); cx.beginPath(); cx.arc(s.x, s.y, s.s, 0, 7); cx.fill(); }
  cx.globalAlpha = 1; if (!done) requestAnimationFrame(draw);
}
size(); addEventListener('resize', size); requestAnimationFrame(draw);

// music: plays the song file if one was added at build time, otherwise the piano piece
const Music = (() => {
  // an original little love song: piano melody over a waltz left hand, strings on the repeat (key of F)
  let ac, master, on = false, timer, nextBar = 0, bar = 0;
  const BPM = 84, beat = 60 / BPM, KEY = 5;
  const f = m => 440 * Math.pow(2, (m + KEY - 69) / 12);
  const PROG = [[48, [60, 64, 67]], [47, [59, 62, 67]], [45, [60, 64, 69]], [41, [60, 65, 69]],
                [38, [57, 60, 65]], [43, [59, 62, 65]], [48, [60, 64, 67]], [48, [58, 64, 67]],
                [41, [60, 65, 69]], [43, [59, 62, 67]], [40, [59, 62, 67]], [45, [60, 64, 69]],
                [38, [57, 60, 65]], [43, [59, 62, 65]], [48, [60, 64, 67]], [43, [59, 62, 65]]];
  const MEL = [[[64, 1], [67, 1], [72, 1]], [[71, 2], [69, .5], [67, .5]], [[69, 1.5], [72, .5], [76, 1]], [[74, 2], [72, 1]],
               [[77, 1], [76, 1], [74, 1]], [[74, 1.5], [71, .5], [67, 1]], [[76, 3]], [[76, 1], [74, 1], [70, 1]],
               [[69, 1], [72, 1], [77, 1]], [[74, 2], [71, 1]], [[79, 1.5], [76, .5], [74, 1]], [[72, 3]],
               [[69, 1], [74, 1], [77, 1]], [[76, 1.5], [74, .5], [71, 1]], [[72, 2], [76, .5], [79, .5]], [[77, 1.5], [74, .5], [71, 1]]];
  function impulse(sec) {
    const n = ac.sampleRate * sec, b = ac.createBuffer(2, n, ac.sampleRate);
    for (let c = 0; c < 2; c++) { const d = b.getChannelData(c); for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 3); }
    return b;
  }
  function init() {
    ac = new (window.AudioContext || window.webkitAudioContext)();
    master = ac.createGain(); master.gain.value = 0;
    const comp = ac.createDynamicsCompressor(); comp.threshold.value = -18; comp.ratio.value = 3;
    const verb = ac.createConvolver(); verb.buffer = impulse(2.8);
    const wet = ac.createGain(); wet.gain.value = .3;
    master.connect(comp); comp.connect(ac.destination); comp.connect(verb); verb.connect(wet); wet.connect(ac.destination);
  }
  function piano(m, t, v, dur) {     // warm piano-ish tone: bright strike that mellows, gentle sustain
    const out = ac.createGain(), lp = ac.createBiquadFilter();
    lp.type = 'lowpass'; lp.frequency.setValueAtTime(3200, t); lp.frequency.exponentialRampToValueAtTime(800, t + 1.4);
    const end = t + Math.min(dur, 3) + .7;
    out.gain.setValueAtTime(0, t); out.gain.linearRampToValueAtTime(v, t + .006);
    out.gain.exponentialRampToValueAtTime(v * .4, t + .35); out.gain.exponentialRampToValueAtTime(.0001, end);
    for (const [type, mult, amp, det] of [['triangle', 1, 1, 0], ['sine', 2, .35, 2], ['sine', 3, .1, -3], ['sine', 1, .5, 5]]) {
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = type; o.frequency.value = f(m) * mult; o.detune.value = det; g.gain.value = amp;
      o.connect(g); g.connect(lp); o.start(t); o.stop(end + .05);
    }
    lp.connect(out); out.connect(master);
  }
  function strings(notes, t, dur, v) {   // soft string section with a little vibrato
    for (const m of notes) for (const det of [-7, 7]) {
      const o = ac.createOscillator(), g = ac.createGain(), lp = ac.createBiquadFilter(), lfo = ac.createOscillator(), lg = ac.createGain();
      o.type = 'sawtooth'; o.frequency.value = f(m); o.detune.value = det;
      lfo.frequency.value = 5.2; lg.gain.value = 6; lfo.connect(lg); lg.connect(o.detune);
      lp.type = 'lowpass'; lp.frequency.value = 1300;
      g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(v, t + .9); g.gain.setValueAtTime(v, t + dur - .3);
      g.gain.linearRampToValueAtTime(0, t + dur + .9);
      o.connect(lp); lp.connect(g); g.connect(master);
      o.start(t); lfo.start(t); o.stop(t + dur + 1); lfo.stop(t + dur + 1);
    }
  }
  const hum = () => (Math.random() - .5) * .018;
  function scheduleBar(t) {
    const k = bar % 16, pass = Math.floor(bar / 16), [b, ch] = PROG[k], len = beat * 3;
    // left hand: rolling waltz arpeggio in eighths
    [b, b + 7, ch[0], ch[1], ch[2], ch[1]].forEach((m, i) =>
      piano(m, t + i * beat / 2 + hum(), (i === 0 ? .085 : .045) * (.85 + Math.random() * .3), beat * (i === 0 ? 3 : .9)));
    // melody (an octave up on every third pass, for a lift)
    let mt = t;
    const lift = pass % 3 === 2 ? 12 : 0;
    for (const [m, d] of MEL[k]) { piano(m + lift, mt + hum(), .15 + Math.random() * .03, d * beat); mt += d * beat; }
    // strings join from the second time round
    if (pass >= 1) strings(ch.map(m => m + 12), t, len, .011);
    if (pass >= 1 && k % 4 === 0) strings([b + 12], t, len * 4, .009);
    bar++;
  }
  function loop() { while (nextBar < ac.currentTime + 1.5) { scheduleBar(nextBar); nextBar += beat * 3; } }
  return {
    get on() { return on; },
    get playing() { return !!ac && ac.state === 'running'; },
    start() {
      if (!ac) init();
      ac.resume(); on = true;
      if (nextBar < ac.currentTime) nextBar = ac.currentTime + .15;
      master.gain.cancelScheduledValues(ac.currentTime);
      master.gain.setValueAtTime(master.gain.value, ac.currentTime); master.gain.linearRampToValueAtTime(.95, ac.currentTime + 2);
      clearInterval(timer); timer = setInterval(loop, 150); loop();
    },
    stop() {
      if (!ac) return; on = false;
      master.gain.cancelScheduledValues(ac.currentTime);
      master.gain.setValueAtTime(master.gain.value, ac.currentTime); master.gain.linearRampToValueAtTime(0, ac.currentTime + 1.2);
      clearInterval(timer); setTimeout(() => { if (!on) ac.suspend(); }, 1400);
    },
  };
})();
const SONG = null;
const mbtn = document.getElementById('mbtn');
let audio = null, muted = false;
if (SONG) { audio = new Audio(SONG); audio.loop = true; audio.volume = .85; audio.preload = 'auto'; }
const isPlaying = () => audio ? !audio.paused : Music.playing;
function play() {
  if (muted) return;
  try { audio ? audio.play().catch(() => {}) : Music.start(); } catch (e) {}
  setTimeout(() => mbtn.classList.toggle('on', isPlaying()), 400);
}
function pause() { try { audio ? audio.pause() : Music.stop(); } catch (e) {} mbtn.classList.remove('on'); }
play();
const kick = () => { if (!muted && !isPlaying()) play(); };
window.__ytKick = kick;
for (const ev of ['pointerdown', 'touchend', 'keydown', 'click']) addEventListener(ev, kick, true);
mbtn.addEventListener('pointerdown', e => { e.stopPropagation(); muted = isPlaying(); muted ? pause() : play(); });
document.addEventListener('visibilitychange', () => { if (!document.hidden) kick(); });

// unlock
const P = JSON.parse(document.getElementById('payload').textContent);
const ub = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const STORE = 'for-jhals-key';
async function keyFromDob(dob) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(dob), 'PBKDF2', false, ['deriveBits']);
  return new Uint8Array(await crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt: ub(P.salt), iterations: P.iter }, base, 256));
}
async function open(bits) {
  const key = await crypto.subtle.importKey('raw', bits, 'AES-GCM', false, ['decrypt']);
  const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: ub(P.iv) }, key, ub(P.ct));
  return new TextDecoder().decode(pt);
}
function reveal(html) {
  document.getElementById('gate').classList.add('leave');
  // the universe opens in a layer above; the song keeps playing underneath without a restart
  const f = document.createElement('iframe');
  f.className = 'app'; f.title = 'for Jhals'; f.setAttribute('allow', 'autoplay');
  f.srcdoc = html;
  document.body.appendChild(f);
  f.addEventListener('load', () => setTimeout(() => f.classList.add('on'), 60));
  setTimeout(() => { done = true; document.getElementById('gate').remove(); cv.remove(); }, 1400);
}
// already remembered on this device?
try {
  const saved = localStorage.getItem(STORE);
  if (saved) open(ub(saved)).then(reveal).catch(() => localStorage.removeItem(STORE));
} catch (e) {}

const dd = document.getElementById('dd'), mm = document.getElementById('mm'), yy = document.getElementById('yy');
const msg = document.getElementById('msg'), go = document.getElementById('go');
// digits flow from box to box, so typing fast or pasting "01012000" just works
const boxes = [[dd, 2], [mm, 2], [yy, 4]];
boxes.forEach(([el], i) => el.addEventListener('input', () => {
  let digits = el.value.replace(/\D/g, '');
  for (let k = i; k < boxes.length; k++) {
    const [b, max] = boxes[k];
    if (k > i) digits += b.value.replace(/\D/g, '');
    b.value = digits.slice(0, max); digits = digits.slice(max);
    if (b.value.length === max && k + 1 < boxes.length && (k > i || el === document.activeElement)) boxes[k + 1][0].focus();
    if (!digits) break;
  }
}));
document.getElementById('f').addEventListener('submit', async e => {
  e.preventDefault();
  const d = dd.value.padStart(2, '0'), m = mm.value.padStart(2, '0'), y = yy.value;
  if (!(+d >= 1 && +d <= 31 && +m >= 1 && +m <= 12 && y.length === 4)) { msg.textContent = 'day / month / year please :)'; return; }
  go.disabled = true; msg.textContent = 'opening…';
  try {
    const bits = await keyFromDob(`${y}-${m}-${d}`);
    const html = await open(bits);
    if (document.getElementById('rem').checked) try { localStorage.setItem(STORE, btoa(String.fromCharCode(...bits))); } catch (e) {}
    msg.textContent = 'hi Jhals ♡';
    reveal(html);
  } catch (err) {
    go.disabled = false; msg.textContent = "hmm, that's not it :)";
    const box = document.getElementById('dob'); box.classList.remove('shake'); box.offsetWidth; box.classList.add('shake');
  }
});
dd.focus();
})();
</script>
